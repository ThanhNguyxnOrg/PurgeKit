name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@ci-v1
    with:
      job_name: Frontend (Svelte & TypeScript)
      node_version: "22"
      package_manager: npm
      cache: npm
      cache_dependency_path: package-lock.json
      prepare_command: npm ci
      validation_command: npm run check
      timeout_minutes: 30

  rust:
    name: Rust Compiler Check
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: 'src-tauri -> target'

      - name: Rust Compiler Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-run

      # Quarantine, backup, database and settings code resolves its storage from
      # APPDATA/LOCALAPPDATA and tests use the temp dir, so point all of them at
      # a throwaway directory under the runner temp folder.
      - name: Run Rust tests against temporary data
        shell: pwsh
        env:
          APPDATA: ${{ runner.temp }}\purgekit-test\Roaming
          LOCALAPPDATA: ${{ runner.temp }}\purgekit-test\Local
          TEMP: ${{ runner.temp }}\purgekit-test\Temp
          TMP: ${{ runner.temp }}\purgekit-test\Temp
        run: |
          New-Item -ItemType Directory -Force -Path $env:APPDATA, $env:LOCALAPPDATA, $env:TEMP | Out-Null
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify tests left the real profile untouched
        shell: pwsh
        run: |
          $leaked = @("$env:APPDATA\PurgeKit", "$env:LOCALAPPDATA\PurgeKit") | Where-Object { Test-Path $_ }
          if ($leaked) {
            Write-Error "Tests wrote outside the temporary data directory: $($leaked -join ', ')"
            exit 1
          }
          Get-ChildItem -Recurse -Force "$env:RUNNER_TEMP\purgekit-test" | Select-Object -ExpandProperty FullName
