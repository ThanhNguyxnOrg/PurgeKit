name: CI Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@2bda8e8e8073a2578db4bbb1e0f6aaf21d061bcd
    with:
      job_name: Frontend (Svelte & TypeScript)
      node_version: "22"
      package_manager: npm
      cache: npm
      cache_dependency_path: package-lock.json
      prepare_command: npm ci
      validation_command: npm run check
      timeout_minutes: 30

  rust:
    name: Rust Compiler Check
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: 'src-tauri -> target'

      - name: Rust Compiler Check
        run: cargo check --manifest-path src-tauri/Cargo.toml
