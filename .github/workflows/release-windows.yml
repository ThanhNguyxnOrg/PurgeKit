name: Release Windows App

on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild (recovery only; no new tag is created).
        required: true
        type: string

permissions:
  contents: write

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate central or manually selected release tag
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG_NAME=""
          if [ "$EVENT_NAME" = "create" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG_NAME="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          fi

          if [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?)$ ]]; then
            VERSION="${TAG_NAME#v}"
            echo "Validated release source tag: $TAG_NAME"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No valid explicit vX.Y.Z tag; skipping."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  release-windows:
    needs: check-trigger
    if: needs.check-trigger.outputs.is_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: ThanhNguyxnOrg/.github/.github/actions/agent-token@da9d02544f60aeec92f8c851846ee3a587044beb
        with:
          profile: content
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout the requested release tag
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.check-trigger.outputs.version }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Get Changelog Entry
        id: get_changelog
        shell: pwsh
        run: |
          $version = "${{ needs.check-trigger.outputs.version }}"
          $cleanVer = $version.TrimStart('v')
          Write-Host "Extracting changelog for version $cleanVer"
          
          if (Test-Path "CHANGELOG.md") {
              $changelog = Get-Content CHANGELOG.md -Raw
              $pattern = "(?s)##\s*\[?v?" + [regex]::Escape($cleanVer) + "\]?.*?\r?\n(.*?)(?=\r?\n##\s*\[?v?\d|\Z)"
              if ($changelog -match $pattern) {
                  $body = $Matches[1].Trim()
                  Write-Host "Found changelog entry for $cleanVer"
              } else {
                  $body = "Release PurgeKit v$cleanVer"
                  Write-Host "Changelog entry for $cleanVer not found. Using default."
              }
          } else {
              $body = "Release PurgeKit v$cleanVer"
          }
          
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body<<EOF"
          Add-Content -Path $env:GITHUB_OUTPUT -Value $body
          Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF"

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          tagName: v${{ needs.check-trigger.outputs.version }}
          releaseName: PurgeKit v${{ needs.check-trigger.outputs.version }}
          releaseDraft: true
          prerelease: ${{ contains(needs.check-trigger.outputs.version, '-') }}
          includeDebug: false
          includeRelease: true
          includeUpdaterJson: false

      - name: Rename and Move Build Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          
          # Find and copy/rename the EXE
          $exeFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "*_x64-setup.exe" -Recurse | Select-Object -First 1
          if ($exeFile) {
              Copy-Item -Path $exeFile.FullName -Destination "artifacts/PurgeKit_x64-setup.exe" -Force
              Write-Host "Copied EXE to artifacts/PurgeKit_x64-setup.exe"
          } else {
              Write-Error "EXE file not found!"
          }
          
          # Find and copy/rename the MSI
          $msiFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Filter "*_x64_en-US.msi" -Recurse | Select-Object -First 1
          if ($msiFile) {
              Copy-Item -Path $msiFile.FullName -Destination "artifacts/PurgeKit_x64_en-US.msi" -Force
              Write-Host "Copied MSI to artifacts/PurgeKit_x64_en-US.msi"
          } else {
              Write-Error "MSI file not found!"
          }

      - name: Upload release assets for central publication
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-purgekit
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified release assets
    needs: [check-trigger, release-windows]
    if: needs.check-trigger.outputs.is_release == 'true'
    permissions:
      actions: read
      contents: read
    uses: ThanhNguyxnOrg/.github/.github/workflows/release-publish.yml@47456eb0c467951cdaa48791d51e902b363e26be
    with:
      tag: v${{ needs.check-trigger.outputs.version }}
      artifact_pattern: release-assets-purgekit
    secrets: inherit
